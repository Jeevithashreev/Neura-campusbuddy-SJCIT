<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusBuddy: SJCIT satellite map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { height:100%; margin:0; font-family: Calibri, "Segoe UI", sans-serif; }
  #map { position:absolute; inset:0; }
  .panel { position:absolute; z-index:1000; background:#fff; border-radius:10px; padding:10px 14px;
           box-shadow:0 2px 8px rgba(0,0,0,.3); font-size:14px; }
  #top { top:10px; left:60px; }
  #top b { color:#1f8a5b; font-size:20px; }
  #legend { bottom:24px; left:10px; }
  .dot { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:5px; }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel" id="top">
  SJCIT campus: <b id="kwh">0.000</b> kWh saved &nbsp;|&nbsp; Rs <b id="rs">0.00</b> (simulated)
</div>
<div class="panel" id="legend">
  <div><span class="dot" style="background:#1f8a5b"></span>Occupied</div>
  <div><span class="dot" style="background:#c8553d"></span>Empty, lights on</div>
  <div><span class="dot" style="background:#f2b33d"></span>Warning</div>
  <div><span class="dot" style="background:#5b6b63"></span>Switched off</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CENTER = [13.3955, 77.7295];

// Real positions taken from Google Maps right-click
const ROOMS = {
  1: [13.395922, 77.727883],   // Admin Block
  2: [13.395160, 77.727830],   // IT Block
  3: [13.395299, 77.729189],   // Library
  4: [13.395294, 77.730605],   // Mechanical Block
  5: [13.395389, 77.731095]    // Aeronautical Dept
};
const NAMES = {
  1: "Admin Block", 2: "IT Block", 3: "Library",
  4: "Mechanical Block", 5: "Aeronautical Dept"
};
const COLORS = { occupied:"#1f8a5b", empty_lights_on:"#c8553d", warning:"#f2b33d", switched_off:"#5b6b63" };
const LABEL = { occupied:"Occupied", empty_lights_on:"Empty, lights on",
                warning:"Warning: switching off soon", switched_off:"Switched off (saving power)" };

const map = L.map("map").setView(CENTER, 17);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 20, maxNativeZoom: 19,
  attribution: "Imagery: Esri, Maxar, Earthstar Geographics"
}).addTo(map);

const markers = {};
function render(s) {
  document.getElementById("kwh").textContent = s.saved_kwh.toFixed(3);
  document.getElementById("rs").textContent = s.saved_rupees.toFixed(2);
  s.rooms.forEach(r => {
    if (!markers[r.id]) {
      markers[r.id] = L.circleMarker(ROOMS[r.id] || CENTER,
        { radius:14, weight:3, color:"#fff", fillOpacity:0.9 }).addTo(map);
    }
    markers[r.id]
      .setStyle({ fillColor: COLORS[r.status] })
      .bindTooltip(`${NAMES[r.id] || r.name}: ${LABEL[r.status]} (people: ${r.persons})`);
  });
}

async function refresh() {
  try { render(await (await fetch("/api/state")).json()); } catch (e) { console.log(e); }
}
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
