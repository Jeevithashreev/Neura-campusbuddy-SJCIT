<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusBuddy: SJCIT satellite map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { height:100%; margin:0; font-family: Calibri, "Segoe UI", sans-serif; }
  #map { position:absolute; inset:0; }
  .panel { position:absolute; z-index:1000; background:#fff; border-radius:10px; padding:10px 14px;
           box-shadow:0 2px 8px rgba(0,0,0,.3); font-size:14px; }
  #top { top:10px; left:60px; }
  #top b { color:#1f8a5b; font-size:20px; }
  #legend { bottom:24px; left:10px; }
  #edit { bottom:24px; right:10px; width:300px; }
  #edit textarea { width:100%; height:110px; font-size:12px; }
  .dot { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:5px; }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel" id="top">
  SJCIT campus: <b id="kwh">0.000</b> kWh saved &nbsp;|&nbsp; Rs <b id="rs">0.00</b> (simulated)
</div>
<div class="panel" id="legend">
  <div><span class="dot" style="background:#1f8a5b"></span>Occupied</div>
  <div><span class="dot" style="background:#c8553d"></span>Empty, lights on</div>
  <div><span class="dot" style="background:#f2b33d"></span>Warning</div>
  <div><span class="dot" style="background:#5b6b63"></span>Switched off</div>
</div>
<div class="panel" id="edit">
  <b>Place rooms:</b> drag each marker onto its real building. Then copy this and send it to me, or paste it into ROOMS below.
  <textarea id="out" readonly></textarea>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CENTER = [13.395711, 77.726810];   // SJCIT (from Wikipedia)

// PLACEHOLDER positions: drag the markers to the real buildings
let ROOMS = {
  1: [13.39600, 77.72640],
  2: [13.39630, 77.72700],
  3: [13.39570, 77.72740],
  4: [13.39530, 77.72690],
  5: [13.39560, 77.72640]
};
const COLORS = { occupied:"#1f8a5b", empty_lights_on:"#c8553d", warning:"#f2b33d", switched_off:"#5b6b63" };
const LABEL = { occupied:"Occupied", empty_lights_on:"Empty, lights on",
                warning:"Warning: switching off soon", switched_off:"Switched off (saving power)" };

const map = L.map("map").setView(CENTER, 18);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 20, maxNativeZoom: 19,
  attribution: "Imagery: Esri, Maxar, Earthstar Geographics"
}).addTo(map);

const markers = {};
function showPositions() {
  const o = {};
  for (const id in markers) {
    const p = markers[id].getLatLng();
    o[id] = [+p.lat.toFixed(6), +p.lng.toFixed(6)];
  }
  document.getElementById("out").value = JSON.stringify(o);
}

function render(s) {
  document.getElementById("kwh").textContent = s.saved_kwh.toFixed(3);
  document.getElementById("rs").textContent = s.saved_rupees.toFixed(2);
  s.rooms.forEach(r => {
    const pos = ROOMS[r.id] || CENTER;
    if (!markers[r.id]) {
      markers[r.id] = L.circleMarker(pos, { radius:14, weight:3, color:"#fff", fillOpacity:0.9 }).addTo(map);
      // drag support: simple custom drag with a hidden marker
      const handle = L.marker(pos, { draggable:true, opacity:0 }).addTo(map);
      handle.on("drag", e => { markers[r.id].setLatLng(e.latlng); });
      handle.on("dragend", showPositions);
    }
    markers[r.id]
      .setStyle({ fillColor: COLORS[r.status] })
      .bindTooltip(`${r.name}: ${LABEL[r.status]} (people: ${r.persons})`);
  });
  showPositions();
}

async function refresh() {
  try { render(await (await fetch("/api/state")).json()); } catch (e) { console.log(e); }
}
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
