<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Copilot: SJCIT</title>
<style>
  body { font-family: Calibri, "Segoe UI", sans-serif; background:#f3f7f4; margin:0; padding:24px; max-width:800px; }
  h1 { color:#1f8a5b; margin:0 0 4px; }
  .links { margin:0 0 16px; }
  #log { background:#fff; border-radius:10px; padding:14px; min-height:200px; box-shadow:0 1px 4px rgba(0,0,0,.15); }
  .q { color:#0f3d2e; font-weight:bold; margin:10px 0 2px; }
  .a { margin:0 0 10px; white-space:pre-wrap; }
  .row { display:flex; gap:8px; margin-top:12px; }
  input { flex:1; padding:10px; font-size:15px; border:1px solid #bbb; border-radius:8px; }
  button { padding:10px 16px; border:0; border-radius:8px; background:#1f8a5b; color:#fff; font-size:15px; cursor:pointer; }
  .chips button { background:#e3ece6; color:#0f3d2e; font-size:13px; padding:6px 10px; margin:6px 6px 0 0; }
</style>
</head>
<body>
<h1>Admin AI Copilot</h1>
<p class="links"><a href="/static/index.html">Dashboard</a> | <a href="/static/map.html">Satellite map</a> | <a href="/static/leaderboard.html">Greenest Block</a></p>
<div id="log"><div class="a">Ask about the live status of the SJCIT buildings. Savings are simulated estimates.</div></div>
<div class="chips">
  <button onclick="ask('Which block saved the most energy?')">Which block saved the most?</button>
  <button onclick="ask('Which buildings are empty with lights on right now?')">Empty with lights on?</button>
  <button onclick="ask('Give a short summary for the admin.')">Short summary</button>
</div>
<div class="row">
  <input id="q" placeholder="Type your question..." onkeydown="if(event.key==='Enter') ask()">
  <button onclick="ask()">Ask</button>
</div>
<script>
async function ask(text) {
  const box = document.getElementById("q");
  const question = text || box.value.trim();
  if (!question) return;
  box.value = "";
  const log = document.getElementById("log");
  log.insertAdjacentHTML("beforeend", `<div class="q"></div><div class="a">Thinking...</div>`);
  const qs = log.querySelectorAll(".q"), as = log.querySelectorAll(".a");
  qs[qs.length - 1].textContent = "Q: " + question;
  const out = as[as.length - 1];
  try {
    const r = await fetch("/api/copilot", { method: "POST", headers: { "Content-Type": "application/json" },
                                           body: JSON.stringify({ question }) });
    out.textContent = (await r.json()).answer;
  } catch (e) { out.textContent = "Could not reach the server."; }
}
</script>
<script src="/static/nav.js"></script></body>
</html>
