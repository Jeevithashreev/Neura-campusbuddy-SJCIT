<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greenest Block: SJCIT</title>
<style>
  body { font-family: Calibri, "Segoe UI", sans-serif; background:#eaf4ec; margin:0 auto; padding:24px; max-width:820px; }
  h1 { color:#0f3d2e; margin:0 0 4px; font-size:34px; }
  p { color:#5b6b63; margin:0 0 18px; }
  a { color:#1f8a5b; font-weight:bold; text-decoration:none; }
  .row { background:#fff; border-radius:14px; padding:16px 20px; margin-bottom:12px; box-shadow:0 2px 8px rgba(0,0,0,.12); }
  .top { display:flex; justify-content:space-between; font-size:21px; color:#0f3d2e; }
  .bar { height:14px; background:#e3ece6; border-radius:7px; margin-top:10px; overflow:hidden; }
  .fill { height:14px; background:linear-gradient(90deg,#1f8a5b,#7ccf9c); border-radius:7px; transition:width .5s; }
</style>
</head>
<body>
<h1>🏆 Greenest Block</h1>
<p><a href="/static/home.html">Home</a> | <a href="/static/index.html">Dashboard</a> | <a href="/static/map.html">Satellite map</a></p>
<p>Ranked by energy saved (simulated, Rs 8 per kWh)</p>
<div id="list"></div>
<script>
async function refresh() {
  try {
    const s = await (await fetch("/api/state")).json();
    const rooms = s.rooms.slice().sort((a, b) => b.saved_kwh - a.saved_kwh);
    const max = Math.max(...rooms.map(r => r.saved_kwh), 0.001);
    document.getElementById("list").innerHTML = rooms.map((r, i) =>
      `<div class="row">
        <div class="top"><span>${["🥇","🥈","🥉"][i] || (i + 1) + "."} ${r.name}</span>
        <span>${r.saved_kwh.toFixed(3)} kWh</span></div>
        <div class="bar"><div class="fill" style="width:${(r.saved_kwh / max) * 100}%"></div></div>
      </div>`).join("");
  } catch (e) { console.log(e); }
}
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
