<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greenest Block: SJCIT</title>
<style>
  body { font-family: Calibri, "Segoe UI", sans-serif; background:#f3f7f4; margin:0; padding:24px; }
  h1 { color:#1f8a5b; margin:0 0 4px; }
  p { color:#555; margin:0 0 20px; }
  .row { background:#fff; border-radius:10px; padding:12px 16px; margin-bottom:10px;
         box-shadow:0 1px 4px rgba(0,0,0,.15); }
  .top { display:flex; justify-content:space-between; font-size:18px; }
  .bar { height:10px; background:#e3ece6; border-radius:5px; margin-top:8px; }
  .fill { height:10px; background:#1f8a5b; border-radius:5px; transition:width .5s; }
</style>
</head>
<body>
<h1>Greenest Block</h1>
<p><a href="/static/index.html">Back to dashboard</a> | <a href="/static/map.html">Satellite map</a></p>
<p>Ranked by energy saved (simulated, Rs 8 per kWh)</p>
<div id="list"></div>
<script>
async function refresh() {
  try {
    const s = await (await fetch("/api/state")).json();
    const rooms = s.rooms.slice().sort((a, b) => b.saved_kwh - a.saved_kwh);
    const max = Math.max(...rooms.map(r => r.saved_kwh), 0.001);
    document.getElementById("list").innerHTML = rooms.map((r, i) =>
      `<div class="row">
        <div class="top"><span>${i + 1}. ${r.name}</span>
        <span>${r.saved_kwh.toFixed(3)} kWh</span></div>
        <div class="bar"><div class="fill" style="width:${(r.saved_kwh / max) * 100}%"></div></div>
      </div>`).join("");
  } catch (e) { console.log(e); }
}
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
